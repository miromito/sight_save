name: SightSave
options:
  bundleIdPrefix: com.rodionlitvinoff
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ONLY_ACTIVE_ARCH: NO
packages:
  SightSave:
    path: .
targets:
  SightSave:
    type: application
    platform: macOS
    sources:
      - path: App/SightSave
        excludes:
          - Resources/Info.plist
          - Resources/SightSave.entitlements
    resources:
      - path: App/SightSave/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodionlitvinoff.SightSave
        PRODUCT_NAME: SightSave
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/SightSave/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SightSave/Resources/SightSave.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    dependencies:
      - package: SightSave
        product: SightSaveCore
    scheme:
      testTargets: []
